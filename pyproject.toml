[project]
name = "walking-tour-guide"
version = "0.1.0"
description = "Walking Tour Guide — a marketplace for creating, buying, and taking self-guided narrated walking tours"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    "httpx==0.28.1",
    "python-multipart==0.0.22",
    "watchfiles==1.1.1",
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.0.52",
]

[tool.uv]
exclude-newer = "14 days"
# workshop-connect is published by us; exempt from the rolling window.
exclude-newer-package = { workshop-connect = "2027-01-01" }
